name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build and publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  published-smoke-test:
    name: Published installer (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Install and verify POSIX artifact
        shell: bash
        env:
          INSTALL_ROOT: ${{ runner.temp }}/skills-manager-smoke
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "$INSTALL_ROOT/bin"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$RELEASE_VERSION/install.sh" -o "$INSTALL_ROOT/install.sh"
          SKILLS_MANAGER_VERSION="$RELEASE_VERSION" SKILLS_MANAGER_INSTALL_DIR="$INSTALL_ROOT/bin" sh "$INSTALL_ROOT/install.sh"
          "$INSTALL_ROOT/bin/skills-manager" --version | grep -F "${RELEASE_VERSION#v}"
